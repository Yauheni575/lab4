version: 2.1

commands:
  install:
    steps:
      - restore_cache:
          key: pip-{{ checksum "requirements.txt" }}
      - run:
          name: Install dependencies
          command: pip install -r requirements.txt
      - save_cache:
          key: pip-{{ checksum "requirements.txt" }}
          paths:
            - ~/.cache/pip

jobs:
  test:
    docker:
      - image: cimg/python:3.11
    steps:
      - checkout
      - install
      - run:
          name: Run tests
          command: pytest

  lint:
    docker:
      - image: cimg/python:3.11
    steps:
      - checkout
      - install
      - run:
          name: Check formatting
          command: black --check .

workflows:
  version: 2
  build-and-test:
    jobs:
      - test
      - lint
