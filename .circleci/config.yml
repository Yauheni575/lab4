version: 2.1

jobs:
  build-and-test:
    docker:
      - image: cimg/python:3.11
    steps:
      - checkout

      # 1. Восстановление кэша pip
      - restore_cache:
          keys:
            - pip-deps-v1-{{ checksum "requirements.txt" }}
            - pip-deps-v1-

      # 2. Установка зависимостей
      - run:
          name: Install dependencies
          command: pip install -r requirements.txt

      # 3. Сохранение кэша
      - save_cache:
          key: pip-deps-v1-{{ checksum "requirements.txt" }}
          paths:
            - ~/.cache/pip

      # 4. Запуск тестов
      - run:
          name: Run tests
          command: pytest

  lint:
    docker:
      - image: cimg/python:3.11
    steps:
      - checkout

      # 1. Восстановление кэша pip
      - restore_cache:
          keys:
            - pip-deps-v1-{{ checksum "requirements.txt" }}
            - pip-deps-v1-

      # 2. Установка зависимостей
      - run:
          name: Install dependencies
          command: pip install -r requirements.txt

      # 3. Сохранение кэша
      - save_cache:
          key: pip-deps-v1-{{ checksum "requirements.txt" }}
          paths:
            - ~/.cache/pip

      # 4. Проверка форматирования
      - run:
          name: Check formatting with Black
          command: black --check .

workflows:
  test_and_lint:
    jobs:
      - build-and-test
      - lint